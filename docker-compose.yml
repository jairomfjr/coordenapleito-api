services:
  coordenapleito-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coordenapleito-api
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://181.215.134.218:5432/coordenapleitodb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "@Systemcode236"
      APP_FRONTEND_BASE_URL: https://coordenapleito.com
      APP_CORS_ALLOWED_ORIGINS: https://coordenapleito.com,http://coordenapleito.com,https://coordenapleito.sps.ce.gov.br,http://coordenapleito.sps.ce.gov.br,http://181.215.134.218:3005,http://181.215.134.218
    ports:
      - "8083:8080"
    networks:
      - coordenapleito-network
    restart: unless-stopped

networks:
  coordenapleito-network:
    driver: bridge

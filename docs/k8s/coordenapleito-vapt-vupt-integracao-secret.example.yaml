# Exemplo: Secret para integração ETL Vapt Vupt → Coordenapleito API
# Aplicar: kubectl apply -f coordenapleito-vapt-vupt-integracao-secret.example.yaml -n <namespace>
# Ajuste o namespace e, se necessário, rotacione o token (openssl rand -hex 32).

apiVersion: v1
kind: Secret
metadata:
  name: coordenapleito-vapt-vupt-integracao
  namespace: coordenapleito
type: Opaque
stringData:
  webhook-token: "364c98e3938417f45287985b126ca0c947c1163ce34842a0248dff645c9dedcf"

---
# Trecho para incluir no Deployment do coordenapleito-api:

#               value: "stage"   # ou production
#             - name: APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN
#               valueFrom:
#                 secretKeyRef:
#                   name: coordenapleito-vapt-vupt-integracao
#                   key: webhook-token
#             # Desbloqueio Flyway se V66 aplicada no banco mas ausente no jar antigo:

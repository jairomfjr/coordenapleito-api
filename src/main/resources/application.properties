# Job: demandas município SOLICITADO com data_expiracao vencida -> REPRIMIDO (fuso America/Fortaleza).
# Em múltiplas réplicas do mesmo ambiente, cada instância roda o job (idempotente).
app.demanda-municipio.expiracao-job.enabled=true
app.demanda-municipio.expiracao-job.cron=0 0 2 * * *
app.demanda-municipio.expiracao-job.zone=America/Fortaleza


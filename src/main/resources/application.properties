# Ambiente: sempre defina um perfil com JDBC — SPRING_PROFILES_ACTIVE=production | stage
# (`application-production.properties` / `application-stage.properties`). Este arquivo agrupa só o que é comum
# a todos os ambientes (e-mail, JWT, MinIO, etc.).
# desenvolvimento local (IDE): -Dspring.profiles.active=stage ou defina SPRING_DATASOURCE_URL / JDBC via env.

# Pool Hikari (padrão maximum-pool-size=10). Ajuste por réplica; somar todas as réplicas ≤ max_connections do PostgreSQL.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
# Em stage/production: 120000 ms (ver application-*.properties). Dev: 0 = desligado.
spring.datasource.hikari.leak-detection-threshold=0

jwt.public.key=keys/coordenapleito-pkey.pem
jwt.private.key=keys/coordenapleito-key.pem

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Sessão JPA aberta durante toda a requisição (padrão Spring Boot). Rotas longas (ex.: SSE) podem segurar conexão mais tempo.
spring.jpa.open-in-view=true
# Padrão para dev local sem perfil stage/production. Perfis stage e production usam ddl-auto=none com Flyway.
spring.jpa.hibernate.ddl-auto=update
# Migrações: V1 schema (usuário, grupo, permissão, endereço) e V2 catálogo de permissões.
spring.flyway.enabled=${app.vapt-vupt.flyway.enabled:true}
spring.flyway.locations=classpath:db/migration,classpath:com/coordenapleito/infrastructure/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Histórico de um banco anterior sem os scripts atuais não bloqueia a subida.
spring.flyway.ignore-migration-patterns=*:missing

# Vapt Vupt — consolidação analítica
app.vapt-vupt.consolidacao.enabled=true
app.vapt-vupt.consolidacao.versao-regra=1.0.0
app.vapt-vupt.consolidacao.scheduler.cron=0 */2 * * * *
app.vapt-vupt.consolidacao.scheduler.zone=America/Fortaleza
# Job diário FULL (05:00 Fortaleza): reconsolida staging após ETL noturno (ex.: 20h do dia anterior).
app.vapt-vupt.consolidacao.daily.enabled=true
app.vapt-vupt.consolidacao.daily.cron=0 0 5 * * *
app.vapt-vupt.consolidacao.daily.zone=America/Fortaleza
app.vapt-vupt.consolidacao.top-limit=8
app.vapt-vupt.consolidacao.sql-query-timeout-segundos=180

# Casa Cidadão — consolidação analítica (domínio independente do Vapt Vupt)
app.casa-cidadao.consolidacao.enabled=true
app.casa-cidadao.consolidacao.versao-regra=1.0.0
app.casa-cidadao.consolidacao.daily.cron=0 0 6 * * *
app.casa-cidadao.consolidacao.daily.zone=America/Fortaleza
app.casa-cidadao.consolidacao.top-limit=8

# Caminhão do Cidadão — consolidação analítica
app.caminhao-cidadao.consolidacao.enabled=true
app.caminhao-cidadao.consolidacao.versao-regra=1.0.0
app.caminhao-cidadao.consolidacao.daily.cron=0 0 6 * * *
app.caminhao-cidadao.consolidacao.daily.zone=America/Fortaleza
app.caminhao-cidadao.consolidacao.top-limit=8


# Ambiente: sempre defina um perfil com JDBC — SPRING_PROFILES_ACTIVE=production | stage
# (`application-production.properties` / `application-stage.properties`). Este arquivo agrupa só o que é comum
# a todos os ambientes (e-mail, JWT, MinIO, etc.).
# desenvolvimento local (IDE): -Dspring.profiles.active=stage ou defina SPRING_DATASOURCE_URL / JDBC via env.

# Pool Hikari (padrão maximum-pool-size=10). Ajuste por réplica; somar todas as réplicas ≤ max_connections do PostgreSQL.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
# Em stage/production: 120000 ms (ver application-*.properties). Dev: 0 = desligado.
spring.datasource.hikari.leak-detection-threshold=0

jwt.public.key=keys/coordenapleito-pkey.pem
jwt.private.key=keys/coordenapleito-key.pem

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Sessão JPA aberta durante toda a requisição (padrão Spring Boot). Rotas longas (ex.: SSE) podem segurar conexão mais tempo.
spring.jpa.open-in-view=true
# Padrão para dev local sem perfil stage/production. Perfis stage e production usam ddl-auto=none com Flyway.
spring.jpa.hibernate.ddl-auto=update
# Migrações: V1 schema (usuário, grupo, permissão, endereço) e V2 catálogo de permissões.
spring.flyway.enabled=${app.vapt-vupt.flyway.enabled:true}
spring.flyway.locations=classpath:db/migration,classpath:com/coordenapleito/infrastructure/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Histórico de um banco anterior sem os scripts atuais não bloqueia a subida.
spring.flyway.ignore-migration-patterns=*:missing

server.servlet.context-path=/coordenapleito-api
# Tomcat padrão ~8KB; Bearer + cookies legados podem exceder em dev.
server.max-http-request-header-size=32KB

# CORS: origens explícitas (obrigatório com cookies HttpOnly). Separe por vírgula.
app.security.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,https://coordenapleito.com,http://coordenapleito.com,https://coordenapleito.sps.ce.gov.br,https://hcoordenapleito.sps.ce.gov.br
# Dev/homolog HTTP: false. Produção (HTTPS) sobrescreve em application-production.properties.
app.security.cookie.secure=false
# SPA: accessToken no JSON + Authorization Bearer (dev e padrão). true = também Set-Cookie HttpOnly.
app.security.auth.http-only-cookie=false

springdoc.swagger-ui.path=/docs
springdoc.packagesToScan=com.coordenapleito
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.default-flat-param-object=true


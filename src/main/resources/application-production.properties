# Perfil production — VPS Hostinger (IP 181.215.134.218).
# Ativação: SPRING_PROFILES_ACTIVE=production
# Porta do host/Nginx: 8083. Segredos podem ser sobrescritos por env/Secret.

server.port=${SERVER_PORT:8083}

spring.jpa.database=POSTGRESQL
spring.sql.init.encoding=UTF-8
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://181.215.134.218:5432/coordenapleitodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@Systemcode236}

# CORS: domínio público (Nginx) e acesso direto na VPS (frontend 3005).
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://coordenapleito.sps.ce.gov.br,http://coordenapleito.sps.ce.gov.br,http://181.215.134.218:3005,http://181.215.134.218}
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}

# Links de e-mail (código de verificação, recuperação de senha).
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://coordenapleito.sps.ce.gov.br}

# Flyway gerencia o schema.
app.vapt-vupt.flyway.enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:com/coordenapleito/infrastructure/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.ignore-migration-patterns=*:missing

# Com Flyway ativo: Hibernate NÃO altera o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.leak-detection-threshold=0

# SMTP: não derruba a API se o Gmail estiver indisponível na VPS.
spring.mail.test-connection=false

# Sem Swagger em produção (igual ao EAD).
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Integração legado (env no K8s/VPS).
app.integracao.vapt-vupt.webhook-token=${APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN:364c98e3938417f45287985b126ca0c947c1163ce34842a0248dff645c9dedcf}

logging.level.com.coordenapleito=INFO
logging.level.org.apache.fontbox=ERROR
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=WARN

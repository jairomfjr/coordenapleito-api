# Perfil production

spring.jpa.database=POSTGRESQL

spring.sql.init.encoding=UTF-8
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://172.20.13.2:5432/coordenapleitodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# CORS apenas do ambiente público de produção (sem localhost).
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://coordenapleito.sps.ce.gov.br}

app.security.cookie.secure=true

# Flyway gerencia o schema (V1 base e V2 permissões).
app.vapt-vupt.flyway.enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:com/coordenapleito/infrastructure/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Histórico de um banco anterior sem os scripts atuais não bloqueia a subida.
spring.flyway.ignore-migration-patterns=*:missing

# Com Flyway ativo: Hibernate NÃO altera o banco.
spring.jpa.hibernate.ddl-auto=none

# Não manter sessão JPA aberta na requisição HTTP inteira (SSE, consolidação longa).
spring.jpa.open-in-view=false

# Consolidação Vapt Vupt pode levar dezenas de segundos na leitura do staging (fora da transação de escrita).
spring.datasource.hikari.leak-detection-threshold=0

# Integração Vapt Vupt (ETL). No K8s: Secret → env APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN
app.integracao.vapt-vupt.webhook-token=${APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN:364c98e3938417f45287985b126ca0c947c1163ce34842a0248dff645c9dedcf}

# Perfil stage

spring.jpa.database=POSTGRESQL

spring.sql.init.encoding=UTF-8
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://172.20.13.73:5432/coordenapleitohomoldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://hcoordenapleito.sps.ce.gov.br}
app.security.cookie.secure=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway gerencia o schema (V1 base e V2 permissões).
app.vapt-vupt.flyway.enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:com/coordenapleito/infrastructure/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.ignore-migration-patterns=*:missing

# Com Flyway ativo: Hibernate não altera o banco.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false
# Consolidação Vapt Vupt: SQL agregado pode levar 20–60s (conexão legítima, não é vazamento).
# 0 = desligado. HikariPoolConfig também força 0 em stage/prod (ignora env K8s com threshold baixo).
spring.datasource.hikari.leak-detection-threshold=0

# Integração Vapt Vupt (ETL). No K8s: Secret → env APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN
app.integracao.vapt-vupt.webhook-token=${APP_INTEGRACAO_VAPT_VUPT_WEBHOOK_TOKEN:364c98e3938417f45287985b126ca0c947c1163ce34842a0248dff645c9dedcf}

# PDFBox: suprime ruído ao indexar fontes do SO (Noto/emoji) — scan ocorre na 1ª geração de PDF
logging.level.org.apache.fontbox=ERROR
logging.level.org.apache.fontbox.ttf.GlyphSubstitutionTable=OFF
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=WARN
